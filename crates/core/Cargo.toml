[package]
name = "sylph-core"
version = "0.1.0"
edition = "2021"
description = "Core document model and logic for Sylph"

[dependencies]
serde = { version = "1", features = ["derive"] }
unicode-segmentation = "1.12"

[dev-dependencies]
serde_json = "1"  # JSON-shape assertions for the export contract (tests only)
